appId: dev.duthris.iptv
productName: Duthris Player
copyright: Duthris

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!**/*.map"

extraResources:
  - from: ../web/out
    to: renderer
    filter: ["**/*"]

asar: true

asarUnpack:
  - "**/node_modules/ffmpeg-static/**"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

  icon: build/icon.ico
  # Kept from the Duthris IPTV days: the start-at-login entry and existing
  # shortcuts point at this file, and an update must not break them.
  executableName: Duthris IPTV

  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Duthris Player

  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish:
  provider: github
  owner: Duthris
  repo: duthris-player
  # Publish straight to a visible release; the default leaves it as a draft.
  releaseType: release
