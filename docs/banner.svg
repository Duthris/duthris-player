<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140c26"/>
      <stop offset="0.55" stop-color="#0b0911"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4c8ff"/>
      <stop offset="0.5" stop-color="#9c81f9"/>
      <stop offset="1" stop-color="#6b6cf0"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9C81F9"/>
      <stop offset="0.52" stop-color="#8050F2"/>
      <stop offset="1" stop-color="#5624CC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow1)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow2)"/>

  <!-- A strip of poster frames drifting off the right edge. -->
  <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  <g clip-path="url(#frame)"><g transform="translate(905 306) rotate(-8) scale(0.78)">
    <rect width="78" height="116" rx="10" fill="#6833E6" fill-opacity="0.35"/>
    <rect x="94" width="78" height="116" rx="10" fill="#9c81f9" fill-opacity="0.22"/>
    <rect x="188" width="78" height="116" rx="10" fill="#4f46e5" fill-opacity="0.28"/>
    <rect x="282" width="78" height="116" rx="10" fill="#d4c8ff" fill-opacity="0.12"/>
  </g></g>

  <!-- App icon. -->
  <g transform="translate(96 72)">
    <rect x="18" y="30" width="224" height="224" rx="58" fill="#7c4dff" opacity="0.55" filter="url(#soft)"/>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#icon)"/>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="13">
      <path d="M74 104a66 66 0 0 1 0 51" stroke-opacity="0.85"/>
      <path d="M182 104a66 66 0 0 0 0 51" stroke-opacity="0.85"/>
    </g>
    <path d="M115 99l50 30.5-50 30.5z" fill="#fff"/>
  </g>

  <g font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="410" y="170" font-size="88" font-weight="800" letter-spacing="-3" fill="url(#title)">Duthris Player</text>
    <text x="414" y="224" font-size="30" font-weight="500" fill="#c9c2e6">Bring your own playlist. Everything stays on your PC.</text>
    <text x="414" y="264" font-size="24" font-weight="400" fill="#8f86ad">Kendi playlist'inizi getirin. Her şey bilgisayarınızda kalır.</text>

    <g transform="translate(414 300)" font-size="17" font-weight="600">
      <rect width="118" height="34" rx="17" fill="#7c4dff" fill-opacity="0.18" stroke="#9c81f9" stroke-opacity="0.45"/>
      <text x="59" y="23" text-anchor="middle" fill="#d4c8ff">Windows</text>
      <rect x="130" width="132" height="34" rx="17" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="196" y="23" text-anchor="middle" fill="#a7f3d0">Open source</text>
      <rect x="274" width="120" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.45"/>
      <text x="334" y="23" text-anchor="middle" fill="#fde68a">Local-first</text>
    </g>
  </g>
</svg>
